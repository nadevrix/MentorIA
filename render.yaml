services:
  - type: web
    name: pyme-ai-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@pyme/core && npm run build --workspace=@pyme/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATA_SOURCE
        value: seed
      - key: FX_SOURCE
        value: static
