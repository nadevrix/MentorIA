# Todo el producto en Render: API, frontend estático y Postgres.
# Cuando lleguen los créditos de Netlify, mover el frontend allá es
# cambiar de proveedor sin tocar código — `netlify.toml` ya está escrito.
#
# Por qué el reparto y qué hace cada pieza: docs/12-infraestructura.md

databases:
  - name: mentor-ia-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    # Misma región que la API: evita latencia entre servicio y base.

services:
  # ---------------------------------------------------------------------------
  # API: el motor de agentes. Necesita un servidor prendido porque el chat
  # transmite la respuesta mientras se genera (SSE) y el loop puede tardar
  # decenas de segundos.
  # ---------------------------------------------------------------------------
  - type: web
    name: mentor-ia-api
    runtime: node
    # `starter` en vez de `free` a propósito: el plan gratuito duerme el servicio
    # tras 15 min sin tráfico y tarda 30-60 s en despertar. Sobre un pitch de
    # 4 minutos eso es fatal, y son ~7 USD al mes de los créditos disponibles.
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build --workspace=@pyme/core && npm run build --workspace=@pyme/api
    # La migración va acá y no en el build: preDeploy corre después de compilar y
    # antes de arrancar, con el entorno de ejecución completo. Si el esquema no se
    # puede aplicar, el deploy falla limpio en vez de levantar una app sin tablas.
    # Sólo disponible en instancias pagas — con el plan free iría en buildCommand.
    #
    # db:seed carga la demo comercial de data/seed/ SOLO si la base está vacía:
    # los deploys siguientes no la recargan y los CSV que suba el comercio nunca
    # se pisan. Una sola fuente de verdad: los JSON versionados del repo.
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # --- Motor de agentes ---
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # se carga a mano en el panel de Render
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Respaldo: si Gemini rate-limitea en vivo, basta con poner LLM_PROVIDER=anthropic
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Frontend permitido ---
      # URL pública del sitio estático, sin barra final.
      - key: CORS_ORIGIN
        value: "https://mentor-ia-web.onrender.com"

      # Evita que una URL pública consuma sin límite las cuotas de los modelos.
      - key: AI_RATE_LIMIT_MAX
        value: "6"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MAX_JSON_BODY_BYTES
        value: "131072"
      - key: MAX_CSV_BODY_BYTES
        value: "2097152"

      # --- Datos ---
      # Postgres con la demo comercial precargada por db:seed en preDeploy.
      # Los CSV de la UI se persisten en la base y reemplazan a la demo.
      - key: DATA_SOURCE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mentor-ia-db
          property: connectionString

      # --- Tipo de cambio ---
      # API pública con caché de 15 min y fallback al histórico en fx_rates.
      - key: FX_SOURCE
        value: dolar-blue-bolivia
      - key: FIRECRAWL_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Interfaz: archivos estáticos. Los sitios estáticos de Render son gratis, se
  # sirven por CDN y NO duermen — a diferencia de los web services.
  # ---------------------------------------------------------------------------
  - type: web
    name: mentor-ia-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      # La URL de la API, sin barra final. Vite la inyecta EN TIEMPO DE BUILD:
      # si se carga después del primer deploy, hay que volver a desplegar.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta cae en index.html, si no un refresh da 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
